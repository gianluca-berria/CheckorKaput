name: Test Harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-harness:
    name: Lint e testes — Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar lint
        run: ruff check .

      - name: Executar test harness
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Salvar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 30
